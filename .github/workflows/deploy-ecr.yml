name: Deploy ECR

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  IMAGE_TAG: ${{ github.run_number }}.${{ github.run_attempt }}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      #######################################################################
      # BUILD + PUSH deivimotors-service
      #######################################################################

      - name: Build deivimotors-service image
        run: |
          docker build -t deivimotors-service:${{ env.IMAGE_TAG }} ./deivimotors-service

      - name: Tag deivimotors-service
        run: |
          docker tag deivimotors-service:${{ env.IMAGE_TAG }} \
            ${{ secrets.ECR_DEIVI_MOTORS_SERVICE }}:${{ env.IMAGE_TAG }}
          docker tag deivimotors-service:${{ env.IMAGE_TAG }} \
            ${{ secrets.ECR_DEIVI_MOTORS_SERVICE }}:latest

      - name: Push deivimotors-service
        run: |
          docker push ${{ secrets.ECR_DEIVI_MOTORS_SERVICE }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ECR_DEIVI_MOTORS_SERVICE }}:latest

      #######################################################################
      # BUILD + PUSH webhook
      #######################################################################

      - name: Build webhook image
        run: |
          docker build -t webhook:${{ env.IMAGE_TAG }} ./webhook

      - name: Tag webhook
        run: |
          docker tag webhook:${{ env.IMAGE_TAG }} \
            ${{ secrets.ECR_WEBHOOK }}:${{ env.IMAGE_TAG }}
          docker tag webhook:${{ env.IMAGE_TAG }} \
            ${{ secrets.ECR_WEBHOOK }}:latest

      - name: Push webhook
        run: |
          docker push ${{ secrets.ECR_WEBHOOK }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.ECR_WEBHOOK }}:latest
